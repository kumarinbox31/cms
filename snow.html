<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel Dashboard</title>
  <style>
    /* Ensure the canvas is full-screen */
    .canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1; /* Send canvas behind the content */
    }
    canvas {
      position: absolute;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Dashboard content -->
  <div class="dashboard">
    <h1>Welcome to Admin Panel</h1>
    <p>Manage your tasks efficiently</p>
    <!-- Add other dashboard content here -->
  </div>

  <!-- Snow Effect Script -->
  <section class="canvas">
    <canvas></canvas>
  </section>
  <script>
    (function () {
      var COUNT = 500;
      var md = document.querySelector('.canvas');
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      var width = window.innerWidth;
      var height = window.innerHeight;
      var i = 0;
      var active = false;

      function onResize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        ctx.fillStyle = '#FFF';

        if (!active) requestAnimFrame(update);
        active = true;
      }

      var Snowflake = function () {
        this.x = 0;
        this.y = 0;
        this.vy = 0;
        this.vx = 0;
        this.r = 0;
        this.reset();
      };

      Snowflake.prototype.reset = function () {
        this.x = Math.random() * width;
        this.y = Math.random() * -height;
        this.vy = 1 + Math.random() * 3;
        this.vx = 0.5 - Math.random();
        this.r = 1 + Math.random() * 2;
        this.o = 0.5 + Math.random() * 0.5;
      };

      canvas.style.position = 'absolute';
      var snowflakes = [];
      var snowflake;

      for (i = 0; i < COUNT; i++) {
        snowflake = new Snowflake();
        snowflake.reset();
        snowflakes.push(snowflake);
      }

      function update() {
        ctx.clearRect(0, 0, width, height);

        for (i = 0; i < COUNT; i++) {
          snowflake = snowflakes[i];
          snowflake.y += snowflake.vy;
          snowflake.x += snowflake.vx;

          ctx.globalAlpha = snowflake.o;
          ctx.beginPath();
          ctx.arc(snowflake.x, snowflake.y, snowflake.r * 4, 0, Math.PI * 2, false);
          ctx.closePath();
          ctx.fill();

          if (snowflake.y > height) {
            snowflake.reset();
          }
        }
        requestAnimFrame(update);
      }

      window.requestAnimFrame = function () {
        return (
          window.requestAnimationFrame ||
          window.webkitRequestAnimationFrame ||
          window.mozRequestAnimationFrame ||
          function (callback) {
            window.setTimeout(callback, 1000 / 60);
          }
        );
      }();

      onResize();
      window.addEventListener('resize', onResize, false);
      md.appendChild(canvas);
    })();
  </script>
</body>
</html>
