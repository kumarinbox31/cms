[PHP]
auto_append_file = ""
auto_prepend_file = ""
display_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
post_max_size = 500M
max_execution_time = 300
max_input_vars = 2500
